name: Awaaz CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Lint and Fast CPU Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Generate synthetic fixture
        run: |
          python scripts/make_fixture.py --output_dir tests/fixtures/synthetic

      - name: Run fast CPU test suite
        run: |
          pytest -v --tb=short tests/ 2>&1 | tee pytest_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E 'FAILED|ERROR|ModuleNotFoundError|ImportError' pytest_output.log | head -n 30)
            exit 1
          fi


